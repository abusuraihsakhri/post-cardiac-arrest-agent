[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "post-cardiac-arrest-engine"
version = "2.0.0"
description = "Post-ROSC educational checklist and legacy synthetic audit demonstrations"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]
test = ["pytest>=8,<10", "pydantic>=2,<3", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["agents", "post_cardiac_arrest_agent"]
py-modules = ["cli", "enrichment", "post_arrest_sentinel", "simulator"]

[project.scripts]
post-cardiac-arrest-engine = "post_cardiac_arrest_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/post-cardiac-arrest-agent"
Repository = "https://github.com/abusuraihsakhri/post-cardiac-arrest-agent.git"
